name: SDANetRegionalFineGateTreatment5K_spatial_split
model_type: SDAModel
scale: 4
num_gpu: 1
manual_seed: 10
datasets:
  train:
    name: Chikusei
    type: PairedMatDataset8xAug
    dataroot_gt: ../datasets/Chikusei_x4_sspsr_spatial_split/trains
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val_1:
    name: Chikusei_eval
    type: PairedMatDataset8xAug
    dataroot_gt: ../datasets/Chikusei_x4_sspsr_spatial_split/evals
    io_backend:
      type: disk
network_g:
  type: SDANET_SADS
  n_feats: 128
  n_block: [2, 2, 2, 2]
  n_group: 4
  num_heads: 4
  scale: 4
  n_colors: 128
  n_lms_colors: 128
  drop_path_rate: 0.4
  expansion_ratio: 1.0
  ste_mask_tau: 0.15
  fine_gate_enabled: true
path:
  pretrain_network_g: /home/aidslab/hemanth-ug4/SDANet_repo/experiments/SDANetRegionalContinue66K_spatial_split/models/net_g_66000.pth
  param_key_g: params_ema
  strict_load_g: true
  allowed_missing_keys:
    - body.0.body.0.fused_attn.fine_gate.weight
    - body.0.body.0.fused_attn.fine_gate.bias
    - body.0.body.1.fused_attn.fine_gate.weight
    - body.0.body.1.fused_attn.fine_gate.bias
    - body.1.body.0.fused_attn.fine_gate.weight
    - body.1.body.0.fused_attn.fine_gate.bias
    - body.1.body.1.fused_attn.fine_gate.weight
    - body.1.body.1.fused_attn.fine_gate.bias
    - body.2.body.0.fused_attn.fine_gate.weight
    - body.2.body.0.fused_attn.fine_gate.bias
    - body.2.body.1.fused_attn.fine_gate.weight
    - body.2.body.1.fused_attn.fine_gate.bias
    - body.3.body.0.fused_attn.fine_gate.weight
    - body.3.body.0.fused_attn.fine_gate.bias
    - body.3.body.1.fused_attn.fine_gate.weight
    - body.3.body.1.fused_attn.fine_gate.bias
  resume_state: ~
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [5000]
    restart_weights: [1]
    eta_min: !!float 1e-7
  total_iter: 5000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  sam_opt:
    type: SAMLoss
    loss_weight: 0.2
val:
  val_freq: 1000
  save_img: false
  pbar: false
  metrics:
    ssim:
      type: calculate_ssim_float
      crop_border: 0
      data_range: 1
    mpsnr:
      type: calculate_mpsnr_hsi
      crop_border: 0
      data_range: 1
    sam:
      type: calculate_sam_hsi
      crop_border: 0
    ergas:
      type: calculate_ergas_hsi
      crop_border: 0
    CC:
      type: calculate_corr_hsi
      crop_border: 0
logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
dist_params:
  backend: nccl
  port: 29709