name: SDANetIndependentUpsamplerFinetune_spatial_split
model_type: SDAModel
scale: 4
num_gpu: 1
manual_seed: 10
datasets:
  train:
    name: Chikusei
    type: PairedMatDataset8xAug
    dataroot_gt: ../datasets/Chikusei_x4_sspsr_spatial_split/trains
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val_1:
    name: Chikusei_eval
    type: PairedMatDataset8xAug
    dataroot_gt: ../datasets/Chikusei_x4_sspsr_spatial_split/evals
    io_backend:
      type: disk
network_g:
  type: SDANET_SADS_IndUp
  n_feats: 128
  n_block:
  - 2
  - 2
  - 2
  - 2
  n_group: 4
  num_heads: 4
  scale: 4
  n_colors: 128
  n_lms_colors: 128
  drop_path_rate: 0.4
  expansion_ratio: 1.0
  ste_mask_tau: 0.15
path:
  pretrain_network_g: /home/aidslab/hemanth-ug4/SDANet_repo/experiments/SDANet_spatial_split_baseline/models/net_g_33000_indup_init.pth
  strict_load_g: false
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 1.0e-05
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: CosineAnnealingRestartLR
    periods:
    - 51000
    restart_weights:
    - 1
    eta_min: 1.0e-07
  total_iter: 51000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  sam_opt:
    type: SAMLoss
    loss_weight: 0.2
val:
  val_freq: 3000
  save_img: false
  pbar: false
  metrics:
    ssim:
      type: calculate_ssim_float
      crop_border: 0
      data_range: 1
    mpsnr:
      type: calculate_mpsnr_hsi
      crop_border: 0
      data_range: 1
    sam:
      type: calculate_sam_hsi
      crop_border: 0
    ergas:
      type: calculate_ergas_hsi
      crop_border: 0
    CC:
      type: calculate_corr_hsi
      crop_border: 0
logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29706
